<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOKA MOTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --surface: #11131a;
      --card-bg: #151822;
      --border: #222634;
      --text: #ffffff;
      --text-muted: #8b92a5;
      --accent: #00ff88;
      --danger: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* CONTENEDOR APP MOBILE FIRST (centrado en pantallas grandes) */
    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--surface);
      position: relative;
      padding-bottom: 90px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    /* HEADER CON LOGO REAL */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(17, 19, 26, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--border);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-brand img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }

    .btn-admin-top {
      background: #1c202e;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
    }

    /* STORIES */
    .section-tag {
      font-size: 0.65rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 14px 18px 8px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    .stories-tray {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 18px 12px;
      scrollbar-width: none;
    }

    .stories-tray::-webkit-scrollbar {
      display: none;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #00ff88, #00d2ff, #ff3366);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--surface);
    }

    .story-title {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* FILTROS */
    .chips-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 18px 14px;
      scrollbar-width: none;
    }

    .chips-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* FEED DE PRODUCTOS */
    .feed-container {
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product-post {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }

    .post-image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 110%;
      background: #000;
    }

    .post-image-wrapper img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .post-details {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .post-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* PALETA DE COLORES */
    .color-dots-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .color-names-summary {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .post-price {
      font-size: 1.15rem;
      font-weight: 900;
      color: #fff;
    }

    .post-stock {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* DOCK INFERIOR FIJO */
    .dock-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 444px;
      background: rgba(21, 24, 34, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 14px;
      z-index: 50;
    }

    .dock-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }

    .dock-btn.active {
      color: #fff;
    }

    .cart-bubble-count {
      position: absolute;
      top: -3px;
      right: 4px;
      background: var(--accent);
      color: #000;
      font-size: 0.65rem;
      font-weight: 900;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MODAL HISTORIAS (CON TIMER CONFIGURABLE) */
    .story-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .story-screen.open {
      display: flex;
    }

    .story-bar-timer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      overflow: hidden;
      z-index: 102;
    }

    .story-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    .story-close-btn {
      position: absolute;
      top: 25px;
      right: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 102;
    }

    .story-display-img {
      width: 100%;
      height: 80vh;
      object-fit: contain;
    }

    .story-bottom-label {
      position: absolute;
      bottom: 40px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* POPUP DETALLE DE PRODUCTO */
    .popup-sheet {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 90;
      display: none;
      align-items: flex-end;
    }

    .popup-sheet.open {
      display: flex;
    }

    .sheet-card {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 24px 24px 0 0;
      padding: 22px;
      border-top: 1px solid var(--border);
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .selector-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .options-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .opt-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .opt-chip.active {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .btn-main-action {
      background: #fff;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 0.85rem;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .input-box {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <div class="app-viewport">

    <!-- HEADER -->
    <header>
      <div class="header-brand">
        <img src="logo.png" alt="Moka Motion">
      </div>
      <a href="admin.html" class="btn-admin-top">ADMIN</a>
    </header>

    <!-- STORIES -->
    <div class="section-tag">
      <span>DROPS & STORIES</span>
      <span style="color:var(--text-muted); font-size:0.55rem;">TAP PARA VER</span>
    </div>
    <div class="stories-tray" id="storiesTray"></div>

    <!-- FILTROS -->
    <div class="chips-bar">
      <button class="chip active" onclick="filtrarCategoria('todos', this)">Todos</button>
      <button class="chip" onclick="filtrarCategoria('calzado', this)">👟 Calzado</button>
      <button class="chip" onclick="filtrarCategoria('ropa', this)">👕 Ropa</button>
      <button class="chip" onclick="filtrarCategoria('anteojos', this)">🕶️ Anteojos</button>
    </div>

    <!-- FEED / PRODUCTOS -->
    <div class="feed-container" id="feedList"></div>

    <!-- DOCK BAR -->
    <nav class="dock-nav">
      <button class="dock-btn active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <span>INICIO</span>
      </button>
      <button class="dock-btn" onclick="abrirCarritoModal()">
        <span>CARRITO</span>
        <div class="cart-bubble-count" id="cartBadge">0</div>
      </button>
    </nav>

  </div>

  <!-- POPUP HISTORIAS (CON TIMER) -->
  <div class="story-screen" id="storyScreen">
    <div class="story-bar-timer">
      <div class="story-bar-fill" id="storyTimerFill"></div>
    </div>
    <button class="story-close-btn" onclick="cerrarStory()">✕</button>
    <img id="storyImage" class="story-display-img" src="" alt="Story">
    <div class="story-bottom-label" id="storyCaption"></div>
  </div>

  <!-- POPUP DETALLE DE PRODUCTO (PARA ELEGIR TALLE Y COLOR) -->
  <div class="popup-sheet" id="productModal" onclick="if(event.target===this) cerrarDetalleProducto()">
    <div class="sheet-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modalProdTitle" style="font-weight:900;">Producto</h3>
        <button onclick="cerrarDetalleProducto()"
          style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div id="modalProdPrice" style="font-size:1.2rem; font-weight:900; color:var(--accent);">$0</div>

      <div>
        <div class="selector-title">Seleccionar Talle</div>
        <div class="options-row" id="modalTallesRow"></div>
      </div>

      <div>
        <div class="selector-title">Seleccionar Color</div>
        <div class="options-row" id="modalColoresRow"></div>
      </div>

      <button class="btn-main-action" onclick="confirmarAgregarAlCarrito()">AGREGAR AL PEDIDO</button>
    </div>
  </div>

  <!-- POPUP CARRITO / FINALIZAR PEDIDO -->
  <div class="popup-sheet" id="cartModal" onclick="if(event.target===this) cerrarCarritoModal()">
    <div class="sheet-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-weight:900;">TU PEDIDO</h3>
        <button onclick="cerrarCarritoModal()"
          style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div id="cartItemsList" style="display:flex; flex-direction:column; gap:8px; max-height:180px; overflow-y:auto;">
      </div>

      <input type="text" id="orderNombre" class="input-box" placeholder="Nombre completo">
      <input type="text" id="orderDireccion" class="input-box" placeholder="Dirección de envío o entrega">

      <div style="display:flex; justify-content:space-between; font-size:1.1rem; font-weight:900; margin-top:6px;">
        <span>Total:</span>
        <span id="cartTotalPrice" style="color:var(--accent);">$0</span>
      </div>

      <button class="btn-main-action" onclick="enviarPedidoWhatsApp()">ENVIAR POR WHATSAPP</button>
    </div>
  </div>

  <script>
    const MI_TELEFONO_WA = '5493462556677'; // TU NÚMERO
    const TIEMPO_STORY_SEGUNDOS = 4; // TIEMPO VISIBLE DE CADA STORY

    // DATOS DE HISTORIAS
    const storiesData = [
      { id: 1, titulo: 'Promociones', img: 'https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=800' },
      { id: 2, titulo: 'Pruebaa', img: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800' }
    ];

    // DATOS DE PRODUCTOS
    const productosData = [
      {
        id: 1,
        nombre: 'Prueba pantalon',
        categoria: 'ropa',
        precio: 10000,
        stock: 5,
        imagenes: ['https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=700'],
        talles: ['S', 'M', 'L', 'XL'],
        colores: [
          { nombre: 'Negro', hex: '#111111' },
          { nombre: 'Blanco', hex: '#ffffff' },
          { nombre: 'Militar', hex: '#4b5320' },
          { nombre: 'Azul', hex: '#1b3a6b' },
          { nombre: 'Verde Fuerte', hex: '#147a32' }
        ]
      }
    ];

    let carrito = [];
    let productoEnSeleccion = null;
    let talleSeleccionado = '';
    let colorSeleccionado = '';
    let storyTimerInterval = null;

    // RENDER HISTORIAS
    function renderStories() {
      const tray = document.getElementById('storiesTray');
      tray.innerHTML = storiesData.map((s, index) => `
        <div class="story-item" onclick="abrirStory(${index})">
          <div class="story-ring"><img src="${s.img}" alt="${s.titulo}"></div>
          <span class="story-title">${s.titulo}</span>
        </div>
      `).join('');
    }

    function abrirStory(index) {
      const s = storiesData[index];
      if (!s) return;
      document.getElementById('storyImage').src = s.img;
      document.getElementById('storyCaption').innerText = s.titulo;
      document.getElementById('storyScreen').classList.add('open');

      // Temporizador visual
      const bar = document.getElementById('storyTimerFill');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      setTimeout(() => {
        bar.style.transition = `width ${TIEMPO_STORY_SEGUNDOS}s linear`;
        bar.style.width = '100%';
      }, 50);

      clearTimeout(storyTimerInterval);
      storyTimerInterval = setTimeout(cerrarStory, TIEMPO_STORY_SEGUNDOS * 1000);
    }

    function cerrarStory() {
      clearTimeout(storyTimerInterval);
      document.getElementById('storyScreen').classList.remove('open');
    }

    // RENDER FEED
    function renderFeed(items) {
      const feed = document.getElementById('feedList');
      feed.innerHTML = items.map(p => {
        const dots = p.colores.map(c => `<span class="color-dot" style="background:${c.hex}"></span>`).join('');
        const colorNames = p.colores.map(c => c.nombre).join(', ');
        return `
          <div class="product-post" onclick="abrirDetalleProducto(${p.id})">
            <div class="post-image-wrapper">
              <img src="${p.imagenes[0]}" alt="${p.nombre}">
              <div class="post-badge">🖼️ ${p.imagenes.length}</div>
            </div>
            <div class="post-details">
              <div class="post-title">${p.nombre}</div>
              <div class="color-dots-row">
                ${dots}
                <span class="color-names-summary">${colorNames}</span>
              </div>
              <div class="post-footer">
                <span class="post-price">$${p.precio.toLocaleString('es-AR')}</span>
                <span class="post-stock">Stock: ${p.stock}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrarCategoria(cat, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      if (cat === 'todos') renderFeed(productosData);
      else renderFeed(productosData.filter(p => p.categoria === cat));
    }

    // SELECCIÓN DE TALLE Y COLOR (POPUP)
    function abrirDetalleProducto(id) {
      productoEnSeleccion = productosData.find(p => p.id === id);
      if (!productoEnSeleccion) return;

      document.getElementById('modalProdTitle').innerText = productoEnSeleccion.nombre;
      document.getElementById('modalProdPrice').innerText = `$${productoEnSeleccion.precio.toLocaleString('es-AR')}`;

      // Render Talles
      talleSeleccionado = productoEnSeleccion.talles[0] || '';
      document.getElementById('modalTallesRow').innerHTML = productoEnSeleccion.talles.map(t => `
        <div class="opt-chip ${t === talleSeleccionado ? 'active' : ''}" onclick="elegirTalle('${t}', this)">${t}</div>
      `).join('');

      // Render Colores
      colorSeleccionado = productoEnSeleccion.colores[0] ? productoEnSeleccion.colores[0].nombre : '';
      document.getElementById('modalColoresRow').innerHTML = productoEnSeleccion.colores.map(c => `
        <div class="opt-chip ${c.nombre === colorSeleccionado ? 'active' : ''}" onclick="elegirColor('${c.nombre}', this)">${c.nombre}</div>
      `).join('');

      document.getElementById('productModal').classList.add('open');
    }

    function elegirTalle(t, el) {
      talleSeleccionado = t;
      el.parentNode.querySelectorAll('.opt-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    function elegirColor(c, el) {
      colorSeleccionado = c;
      el.parentNode.querySelectorAll('.opt-chip').forEach(chip => chip.classList.remove('active'));
      el.classList.add('active');
    }

    function cerrarDetalleProducto() {
      document.getElementById('productModal').classList.remove('open');
    }

    function confirmarAgregarAlCarrito() {
      carrito.push({
        id: productoEnSeleccion.id,
        nombre: productoEnSeleccion.nombre,
        precio: productoEnSeleccion.precio,
        talle: talleSeleccionado,
        color: colorSeleccionado
      });
      document.getElementById('cartBadge').innerText = carrito.length;
      cerrarDetalleProducto();
      abrirCarritoModal();
    }

    // CARRITO Y WHATSAPP
    function abrirCarritoModal() {
      const list = document.getElementById('cartItemsList');
      let total = 0;
      list.innerHTML = carrito.map((item, idx) => {
        total += item.precio;
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; background:#191d28; padding:8px 12px; border-radius:10px; font-size:0.8rem;">
            <div>
              <div style="font-weight:700;">${item.nombre}</div>
              <div style="color:var(--text-muted); font-size:0.7rem;">${item.talle} / ${item.color}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:900;">$${item.precio.toLocaleString('es-AR')}</span>
              <button onclick="borrarItemCarrito(${idx})" style="background:none; border:none; color:var(--danger); cursor:pointer;">🗑️</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartTotalPrice').innerText = `$${total.toLocaleString('es-AR')}`;
      document.getElementById('cartModal').classList.add('open');
    }

    function borrarItemCarrito(idx) {
      carrito.splice(idx, 1);
      document.getElementById('cartBadge').innerText = carrito.length;
      abrirCarritoModal();
    }

    function cerrarCarritoModal() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function enviarPedidoWhatsApp() {
      const nombre = document.getElementById('orderNombre').value.trim();
      const direccion = document.getElementById('orderDireccion').value.trim();

      if (!nombre || !direccion) {
        alert('Por favor, ingresá tu nombre y la dirección de entrega.');
        return;
      }
      if (carrito.length === 0) {
        alert('El pedido está vacío.');
        return;
      }

      let total = 0;
      let msg = `*MOKA MOTION - PEDIDO*\n`;
      msg += `Cliente: ${nombre}\n`;
      msg += `Destino: ${direccion}\n\n`;

      carrito.forEach(p => {
        msg += `• ${p.nombre} [Talle: ${p.talle} | Color: ${p.color}] - $${p.precio.toLocaleString('es-AR')}\n`;
        total += p.precio;
      });
