<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOKA MOTION</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12141c;
      --border: #232738;
      --accent: #00ff88;
      --text-main: #f3f4f6;
      --text-muted: #8e95a5;
      --red: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 90px; }

    /* HEADER */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 20px; position: sticky; top: 0; background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border);
    }
    .logo-container { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 1.25rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
    .logo-text span { color: var(--accent); }
    .btn-admin {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; text-decoration: none; font-weight: 600;
    }

    /* STORIES */
    .section-title { font-size: 0.7rem; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); margin: 16px 20px 10px; text-transform: uppercase; }
    .stories-bar { display: flex; gap: 14px; overflow-x: auto; padding: 0 20px 12px; scrollbar-width: none; }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-bubble { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
    .story-ring {
      width: 66px; height: 66px; border-radius: 50%; padding: 2px;
      background: linear-gradient(45deg, var(--accent), #00bfff, var(--red));
      display: flex; align-items: center; justify-content: center;
    }
    .story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg); }
    .story-label { font-size: 0.7rem; font-weight: 600; color: var(--text-main); max-width: 70px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

    /* FILTROS */
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 6px 20px 16px; scrollbar-width: none; }
    .filter-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted);
      padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .filter-btn.active { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }

    /* GRID PRODUCTOS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; padding: 0 20px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s;
    }
    .card-img-wrap { position: relative; width: 100%; padding-top: 120%; overflow: hidden; background: #1a1d28; }
    .card-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 0.85rem; font-weight: 600; line-height: 1.2; }
    .card-price { font-size: 1rem; font-weight: 900; color: var(--accent); }
    .btn-buy {
      width: 100%; background: #232738; color: var(--text-main); border: 1px solid transparent;
      padding: 9px; border-radius: 10px; font-weight: 700; font-size: 0.75rem; cursor: pointer; text-transform: uppercase;
    }
    .btn-buy:hover { background: var(--text-main); color: var(--bg); }

    /* DOCK FLOTANTE INFERIOR */
    .bottom-dock {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 40px); max-width: 420px; background: rgba(18, 20, 28, 0.85);
      backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 28px;
      display: flex; justify-content: space-around; align-items: center; padding: 10px 16px; z-index: 80;
    }
    .dock-item {
      background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column;
      align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; position: relative;
    }
    .dock-item.active { color: var(--accent); }
    .dock-badge {
      position: absolute; top: -4px; right: 2px; background: var(--accent); color: var(--bg);
      font-size: 0.65rem; font-weight: 900; width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* MODAL DE HISTORIA COMPLETA */
    .story-overlay {
      display: none; position: fixed; inset: 0; background: #000; z-index: 100;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .story-overlay.open { display: flex; }
    .story-full-img { max-width: 100%; max-height: 85vh; object-fit: contain; }
    .story-close {
      position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2);
      border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
    }
    .story-caption { position: absolute; bottom: 30px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 18px; border-radius: 20px; }

    /* MODAL CARRITO */
    .cart-drawer {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 90;
      align-items: flex-end; backdrop-filter: blur(4px);
    }
    .cart-drawer.open { display: flex; }
    .cart-content {
      background: var(--card-bg); width: 100%; max-width: 500px; margin: 0 auto;
      border-radius: 24px 24px 0 0; padding: 24px; border: 1px solid var(--border);
      max-height: 85vh; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
    }
    .input-field {
      width: 100%; background: #0c0d12; border: 1px solid var(--border);
      color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 0.9rem;
    }
    .btn-checkout {
      width: 100%; background: var(--accent); color: var(--bg); border: none;
      padding: 14px; border-radius: 14px; font-weight: 900; font-size: 0.95rem; cursor: pointer; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-text">MOKA<span>MOTION</span></div>
    </div>
    <a href="admin.html" class="btn-admin">PANEL ADMIN</a>
  </header>

  <div class="section-title">DROPS & STORIES</div>
  <div class="stories-bar" id="storiesContainer">
    <!-- Stories dinámicas -->
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filtrar('todos')">Todos</button>
    <button class="filter-btn" onclick="filtrar('calzado')">Calzado</button>
    <button class="filter-btn" onclick="filtrar('ropa')">Ropa</button>
    <button class="filter-btn" onclick="filtrar('accesorios')">Accesorios</button>
  </div>

  <div class="grid" id="catalogoGrid"></div>

  <!-- DOCK INFERIOR -->
  <nav class="bottom-dock">
    <button class="dock-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <span>TIENDA</span>
    </button>
    <button class="dock-item" onclick="abrirCarrito()">
      <span>CARRITO</span>
      <div class="dock-badge" id="cartCount">0</div>
    </button>
  </nav>

  <!-- MODAL STORIES -->
  <div class="story-overlay" id="storyOverlay">
    <button class="story-close" onclick="cerrarStory()">✕</button>
    <img id="storyViewerImg" class="story-full-img" src="" alt="Story">
    <div class="story-caption" id="storyViewerCaption"></div>
  </div>

  <!-- MODAL CARRITO / CHECKOUT -->
  <div class="cart-drawer" id="cartDrawer" onclick="if(event.target === this) cerrarCarrito()">
    <div class="cart-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-weight:900;">TU PEDIDO</h3>
        <button onclick="cerrarCarrito()" style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div id="cartItems" style="display:flex; flex-direction:column; gap:10px; max-height:200px; overflow-y:auto;"></div>
      
      <input type="text" id="custNombre" class="input-field" placeholder="Tu Nombre">
      <input type="text" id="custDireccion" class="input-field" placeholder="Dirección / Destino">
      
      <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.1rem; margin-top:8px;">
        <span>TOTAL</span>
        <span id="cartTotal" style="color:var(--accent);">$0</span>
      </div>
      
      <button class="btn-checkout" onclick="enviarWhatsApp()">FINALIZAR POR WHATSAPP</button>
    </div>
  </div>

  <script>
    // REEMPLAZÁ CON TUS CLAVES REALES DE SUPABASE
    const SUPABASE_URL = 'TU_SUPABASE_URL';
    const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
    const supabaseClient = (SUPABASE_URL !== 'TU_SUPABASE_URL') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let productos = [];
    let stories = [];
    let carrito = [];
    const MI_WHATSAPP = '5493462556677'; // TU NÚMERO

    // 1. CARGA DE HISTORIAS CON APERTURA CORRECTA
    async function cargarStories() {
      const container = document.getElementById('storiesContainer');
      if (supabaseClient) {
        const { data } = await supabaseClient.from('stories').select('*').order('id', { ascending: false });
        stories = data || [];
      } else {
        stories = [
          { id: 1, titulo: 'Drop 01', imagen: 'https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=800' },
          { id: 2, titulo: 'Promo', imagen: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800' }
        ];
      }

      container.innerHTML = stories.map((s, index) => `
        <div class="story-bubble" onclick="abrirStory(${index})">
          <div class="story-ring"><img src="${s.imagen}" alt="${s.titulo}"></div>
          <span class="story-label">${s.titulo}</span>
        </div>
      `).join('');
    }

    function abrirStory(index) {
      const item = stories[index];
      if (!item) return;
      document.getElementById('storyViewerImg').src = item.imagen;
      document.getElementById('storyViewerCaption').innerText = item.titulo;
      document.getElementById('storyOverlay').classList.add('open');
    }

    function cerrarStory() {
      document.getElementById('storyOverlay').classList.remove('open');
    }

    // 2. CATÁLOGO
    async function cargarCatalogo() {
      const grid = document.getElementById('catalogoGrid');
      if (supabaseClient) {
        const { data } = await supabaseClient.from('productos').select('*');
        productos = data || [];
      } else {
        productos = [
          { id: 1, nombre: 'Pantalón Cargo Táctico', categoria: 'ropa', precio: 18000, imagen: 'https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=600' },
          { id: 2, nombre: 'Zapatillas Retro Motion', categoria: 'calzado', precio: 34000, imagen: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600' }
        ];
      }
      renderizar(productos);
    }

    function renderizar(lista) {
      document.getElementById('catalogoGrid').innerHTML = lista.map(p => `
        <div class="card">
          <div class="card-img-wrap"><img src="${p.imagen}" alt="${p.nombre}"></div>
          <div class="card-body">
            <div class="card-title">${p.nombre}</div>
            <div class="card-price">$${p.precio.toLocaleString('es-AR')}</div>
            <button class="btn-buy" onclick="agregarAlCarrito(${p.id})">Agregar</button>
          </div>
        </div>
      `).join('');
    }

    function filtrar(cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if(cat === 'todos') renderizar(productos);
      else renderizar(productos.filter(p => p.categoria === cat));
    }

    // 3. CARRITO Y CHECKOUT DIRECTO
    function agregarAlCarrito(id) {
      const item = productos.find(p => p.id === id);
      if (item) {
        carrito.push(item);
        document.getElementById('cartCount').innerText = carrito.length;
        abrirCarrito();
      }
    }

    function abrirCarrito() {
      const list = document.getElementById('cartItems');
      let total = 0;
      list.innerHTML = carrito.map((c, i) => {
        total += c.precio;
        return `<div style="display:flex; justify-content:space-between; align-items:center; background:#181b26; padding:10px; border-radius:10px;">
          <span>${c.nombre}</span>
          <span style="font-weight:900;">$${c.precio.toLocaleString('es-AR')}</span>
        </div>`;
      }).join('');
      document.getElementById('cartTotal').innerText = `$${total.toLocaleString('es-AR')}`;
      document.getElementById('cartDrawer').classList.add('open');
    }

    function cerrarCarrito() {
      document.getElementById('cartDrawer').classList.remove('open');
    }

    function enviarWhatsApp() {
      const nom = document.getElementById('custNombre').value.trim();
      const dir = document.getElementById('custDireccion').value.trim();
      if (!nom || !dir) return alert('Por favor completá tu nombre y dirección.');
      if (carrito.length === 0) return alert('El carrito está vacío.');

      let total = 0;
      let msg = `*MOKA MOTION - PEDIDO*\nCliente: ${nom}\nDestino: ${dir}\n\n`;
      carrito.forEach(c => {
        msg += `• ${c.nombre} ($${c.precio.toLocaleString('es-AR')})\n`;
        total += c.precio;
      });
      msg += `\n*TOTAL: $${total.toLocaleString('es-AR')}*`;

      window.open(`https://wa.me/${MI_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    cargarStories();
    cargarCatalogo();
  </script>
</body>
</html>
