<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOKA MOTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0d13;
      --glass-card: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-warm: #d97746;
      --text: #ffffff;
      --text-dim: #9aa1b2;
      --text-sub: #6c7385;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 90% 0%, rgba(217, 119, 70, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 0% 20%, rgba(36, 82, 102, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(18, 22, 32, 0.9) 0%, #08090d 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-frame {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      position: relative;
      padding-bottom: 100px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
    }

    /* HEADER CON TU LOGO REAL */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 10px;
    }
    .brand-logo-img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .icon-circle-btn:hover { background: rgba(255, 255, 255, 0.12); }

    /* STORIES */
    .stories-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 20px 18px;
      scrollbar-width: none;
    }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
    .story-avatar-wrap {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), var(--glass-border));
      position: relative;
    }
    .story-avatar-wrap.highlight {
      background: linear-gradient(135deg, #10b981, #06b6d4);
    }
    .story-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #181c26;
      border: 2px solid #0f1218;
    }
    .story-add-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #fff;
      color: #000;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 900;
      border: 2px solid #0f1218;
    }
    .story-name { font-size: 0.7rem; color: var(--text-dim); font-weight: 500; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* CATEGORÍAS */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px 12px;
    }
    .section-heading { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .section-link { font-size: 0.75rem; color: var(--text-sub); text-decoration: none; font-weight: 600; cursor: pointer; }

    .categories-scroller {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px 18px;
      scrollbar-width: none;
    }
    .categories-scroller::-webkit-scrollbar { display: none; }
    .category-box {
      width: 68px;
      height: 72px;
      flex-shrink: 0;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .category-box.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .category-box span.emoji { font-size: 1.25rem; }
    .category-title { font-size: 0.65rem; color: var(--text-dim); font-weight: 600; text-align: center; text-transform: capitalize; }

    /* BANNER DINÁMICO */
    .hero-card-wrap { padding: 0 20px 22px; }
    .hero-card {
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, rgba(28, 64, 80, 0.8) 0%, rgba(184, 88, 52, 0.75) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      min-height: 160px;
      display: flex;
      align-items: center;
      padding: 20px;
      cursor: pointer;
    }
    .hero-content { z-index: 2; max-width: 65%; display: flex; flex-direction: column; gap: 6px; }
    .hero-label { font-size: 0.7rem; color: rgba(255,255,255,0.75); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .hero-title { font-size: 1.25rem; font-weight: 900; line-height: 1.15; color: #fff; }
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      margin-top: 6px;
      background: none;
      border: none;
    }
    .hero-image-bg {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 100%;
      width: 45%;
      object-fit: cover;
      object-position: top;
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, transparent 100%);
    }

    /* PRODUCTOS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 20px;
    }
    .product-tile {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      backdrop-filter: blur(8px);
    }
    .tile-img-box {
      width: 100%;
      padding-top: 125%;
      position: relative;
      background: #0d1017;
    }
    .tile-img-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tag-sale {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ef4444;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 6px;
    }
    .tile-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .tile-name { font-size: 0.82rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-price { font-size: 0.95rem; font-weight: 900; color: #fff; }

    /* DOCK NAVBAR */
    .bottom-dock {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 404px;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 16px;
      z-index: 50;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .dock-link {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      text-decoration: none;
    }
    .dock-link i { font-size: 1.15rem; }
    .dock-link.active { color: #fff; }
    .dock-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent-warm);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* POPUP MANUAL PERSISTENTE */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #131722;
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .modal-close-ico {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }
    .modal-img-wrap { width: 100%; height: 320px; background: #08090d; }
    .modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .modal-title { font-size: 1.1rem; font-weight: 800; }

    /* DETALLE PRENDA Y CHECKOUT */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 90;
      display: none;
      align-items: flex-end;
    }
    .drawer-overlay.open { display: flex; }
    .drawer-card {
      background: #141824;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      border-radius: 26px 26px 0 0;
      padding: 24px 20px;
      border-top: 1px solid var(--glass-border);
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chip-selector-title { font-size: 0.7rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
    .chip-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-chip-opt {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .filter-chip-opt.active { background: #fff; color: #000; border-color: #fff; }
    
    .btn-action-solid {
      background: #fff;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      margin-top: 6px;
    }
    .input-flat {
      width: 100%;
      background: #0d1017;
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- HEADER -->
    <div class="top-bar">
      <img src="logo.png" alt="Moka Motion" class="brand-logo-img">
      <div class="top-actions">
        <a href="admin.html" class="icon-circle-btn" title="Panel de Control"><i class="fa-solid fa-gear"></i></a>
        <button class="icon-circle-btn" onclick="abrirDrawerCarrito()"><i class="fa-solid fa-bag-shopping"></i></button>
      </div>
    </div>

    <!-- STORIES -->
    <div class="stories-row" id="storiesContainer"></div>

    <!-- CATEGORÍAS -->
    <div class="section-header">
      <h2 class="section-heading">Categorías</h2>
      <span class="section-link" onclick="filtrarCat('todos')">Ver todas</span>
    </div>
    <div class="categories-scroller" id="categoriesContainer"></div>

    <!-- BANNER DINÁMICO (TOMA TU PRODUCTO O DROP DESTACADO) -->
    <div class="hero-card-wrap">
      <div class="hero-card" id="heroCardBanner" onclick="clickBannerDestacado()">
        <div class="hero-content">
          <span class="hero-label" id="heroTag">Nueva Colección</span>
          <h1 class="hero-title" id="heroTitle">MOKA MOTION</h1>
          <div class="hero-btn">Ver producto <i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <img id="heroImage" src="" class="hero-image-bg" alt="Destacado">
      </div>
    </div>

    <!-- RECOMENDADOS -->
    <div class="section-header">
      <h2 class="section-heading">Prendas recomendadas</h2>
    </div>
    <div class="products-grid" id="productsGrid"></div>

    <!-- DOCK NAVBAR -->
    <nav class="bottom-dock">
      <button class="dock-link active" onclick="filtrarCat('todos')">
        <i class="fa-solid fa-house"></i>
        <span>Inicio</span>
      </button>
      <button class="dock-link" onclick="filtrarCat('todos')">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Tienda</span>
      </button>
      <button class="dock-link" onclick="abrirDrawerCarrito()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Carrito</span>
        <div class="dock-badge" id="dockCartCount">0</div>
      </button>
      <a href="admin.html" class="dock-link">
        <i class="fa-solid fa-user"></i>
        <span>Admin</span>
      </a>
    </nav>
  </div>

  <!-- POPUP MANUAL PERSISTENTE (SOLO SE CIERRA TOCANDO LA CRUZ) -->
  <div class="modal-backdrop" id="staticPopupModal" onclick="if(event.target===this) cerrarModalPopup()">
    <div class="modal-box">
      <div class="modal-close-ico" onclick="cerrarModalPopup()"><i class="fa-solid fa-xmark"></i></div>
      <div class="modal-img-wrap">
        <img id="popupImg" src="" alt="Popup">
      </div>
      <div class="modal-body">
        <div class="modal-title" id="popupTitle">MOKA MOTION</div>
        <button class="btn-action-solid" onclick="cerrarModalPopup()">ENTENDIDO</button>
      </div>
    </div>
  </div>

  <!-- DETALLE DEL PRODUCTO -->
  <div class="drawer-overlay" id="productDrawer" onclick="if(event.target===this) cerrarDrawerProd()">
    <div class="drawer-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="pDetailName" style="font-weight:800; font-size:1.1rem;">Prenda</h3>
        <button onclick="cerrarDrawerProd()" style="background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="pDetailPrice" style="font-size:1.25rem; font-weight:900; color:var(--accent-warm);">$0</div>

      <div id="tallesWrap">
        <div class="chip-selector-title">Seleccionar Talle</div>
        <div class="chip-list" id="pDetailTalles"></div>
      </div>

      <div id="coloresWrap">
        <div class="chip-selector-title">Seleccionar Color</div>
        <div class="chip-list" id="pDetailColores"></div>
      </div>

      <button class="btn-action-solid" onclick="confirmarAlCarrito()">AGREGAR AL CARRITO</button>
    </div>
  </div>

  <!-- DRAWER CARRITO / CHECKOUT -->
  <div class="drawer-overlay" id="cartDrawer" onclick="if(event.target===this) cerrarDrawerCarrito()">
    <div class="drawer-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-weight:800;">TU PEDIDO</h3>
        <button onclick="cerrarDrawerCarrito()" style="background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="cartItemsContainer" style="display:flex; flex-direction:column; gap:8px; max-height:180px; overflow-y:auto;"></div>

      <input type="text" id="custName" class="input-flat" placeholder="Nombre completo">
      <input type="text" id="custAddr" class="input-flat" placeholder="Dirección de entrega">

      <div style="display:flex; justify-content:space-between; font-size:1.1rem; font-weight:800; margin-top:4px;">
        <span>Total</span>
        <span id="cartSumPrice">$0</span>
      </div>

      <button class="btn-action-solid" onclick="checkoutWA()">FINALIZAR POR WHATSAPP</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jsymymfchgqadrycchkb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5GGAOsVNCKWME8hbvTlcQQ_FxBftQYO';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const TELEFONO_WA = '5493462325547';

    let listaHistorias = [];
    let listaProductos = [];
    let carrito = [];
    let prodActual = null;
    let prodBannerId = null;
    let talleElegido = '';
    let colorElegido = '';

    async function init() {
      await Promise.all([cargarStories(), cargarCategorias(), cargarProductos()]);
      verificarPopup();
    }

    async function cargarStories() {
      const { data } = await db.from('historias').select('*').eq('activo', true).order('id', { ascending: false });
      listaHistorias = data || [];
      const cont = document.getElementById('storiesContainer');
      
      let html = `
        <div class="story-unit" onclick="window.location.href='admin.html'">
          <div class="story-avatar-wrap">
            <img src="logo.png" alt="Admin">
            <div class="story-add-badge">+</div>
          </div>
          <span class="story-name">Crear</span>
        </div>
      `;

      html += listaHistorias.map((s, idx) => `
        <div class="story-unit" onclick="verStoryModal(${idx})">
          <div class="story-avatar-wrap ${idx === 0 ? 'highlight' : ''}">
            <img src="${s.imagen}" alt="${s.titulo}">
          </div>
          <span class="story-name">${s.titulo}</span>
        </div>
      `).join('');

      cont.innerHTML = html;
    }

    function verStoryModal(idx) {
      const s = listaHistorias[idx];
      if (!s) return;
      document.getElementById('popupImg').src = s.imagen;
      document.getElementById('popupTitle').innerText = s.titulo;
      document.getElementById('staticPopupModal').classList.add('open');
    }

    function cerrarModalPopup() {
      document.getElementById('staticPopupModal').classList.remove('open');
    }

    function verificarPopup() {
      const pStory = listaHistorias.find(s => s.es_popup);
      if (pStory) {
        document.getElementById('popupImg').src = pStory.imagen;
        document.getElementById('popupTitle').innerText = pStory.titulo;
        document.getElementById('staticPopupModal').classList.add('open');
        return;
      }
      const pProd = listaProductos.find(p => p.es_popup);
      if (pProd) {
        abrirDrawerProd(pProd.id);
      }
    }

    async function cargarCategorias() {
      const { data } = await db.from('categorias').select('*').order('id', { ascending: true });
      const cats = data && data.length > 0 ? data : [
        { id: 1, nombre: 'calzado', icono: '👟' },
        { id: 2, nombre: 'ropa', icono: '👕' }
      ];

      const cont = document.getElementById('categoriesContainer');
      cont.innerHTML = cats.map(c => `
        <div class="category-box" onclick="filtrarCat('${c.nombre}')">
          <span class="emoji">${c.icono || '🏷️'}</span>
          <span class="category-title">${c.nombre}</span>
        </div>
      `).join('');
    }

    async function cargarProductos() {
      const { data } = await db.from('productos').select('*').order('id', { ascending: false });
      listaProductos = data || [];
      renderBannerHero(listaProductos);
      renderGrid(listaProductos);
    }

    function renderBannerHero(items) {
      if (items.length === 0) return;
      const destacado = items.find(p => p.en_oferta) || items[0];
      prodBannerId = destacado.id;
      document.getElementById('heroTitle').innerText = destacado.nombre;
      document.getElementById('heroTag').innerText = destacado.en_oferta ? 'En Oferta' : 'Destacado';
      const foto = (destacado.imagenes && destacado.imagenes[0]) || destacado.imagen || '';
      document.getElementById('heroImage').src = foto;
    }

    function clickBannerDestacado() {
      if (prodBannerId) abrirDrawerProd(prodBannerId);
    }

    function renderGrid(items) {
      const grid = document.getElementById('productsGrid');
      if (items.length === 0) {
        grid.innerHTML = '<p style="grid-column:span 2; text-align:center; color:var(--text-dim); padding:30px 0; font-size:0.8rem;">No hay prendas cargadas</p>';
        return;
      }

      grid.innerHTML = items.map(p => {
        const foto = (p.imagenes && p.imagenes[0]) || p.imagen || '';
        return `
          <div class="product-tile" onclick="abrirDrawerProd(${p.id})">
            <div class="tile-img-box">
              <img src="${foto}" alt="${p.nombre}">
              ${p.en_oferta ? '<span class="tag-sale">SALE</span>' : ''}
            </div>
            <div class="tile-info">
              <div class="tile-name">${p.nombre}</div>
              <div class="tile-price">$${Number(p.precio).toLocaleString('es-AR')}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrarCat(cat) {
      if (cat === 'todos') renderGrid(listaProductos);
      else renderGrid(listaProductos.filter(p => (p.categoria || '').toLowerCase() === cat.toLowerCase()));
    }

    function abrirDrawerProd(id) {
      prodActual = listaProductos.find(p => p.id === id);
      if (!prodActual) return;

      document.getElementById('pDetailName').innerText = prodActual.nombre;
      document.getElementById('pDetailPrice').innerText = `$${Number(prodActual.precio).toLocaleString('es-AR')}`;

      const talles = prodActual.talles || [];
      const wrapT = document.getElementById('tallesWrap');
      if (talles.length > 0) {
        wrapT.style.display = 'block';
        talleElegido = talles[0];
        document.getElementById('pDetailTalles').innerHTML = talles.map((t, i) => `
          <div class="filter-chip-opt ${i===0?'active':''}" onclick="selTalle('${t}', this)">${t}</div>
        `).join('');
      } else {
        wrapT.style.display = 'none';
        talleElegido = 'Único';
      }

      const colores = prodActual.colores || [];
      const wrapC = document.getElementById('coloresWrap');
      if (colores.length > 0) {
        wrapC.style.display = 'block';
        colorElegido = colores[0];
        document.getElementById('pDetailColores').innerHTML = colores.map((c, i) => `
          <div class="filter-chip-opt ${i===0?'active':''}" onclick="selColor('${c}', this)">${c}</div>
        `).join('');
      } else {
        wrapC.style.display = 'none';
        colorElegido = 'Original';
      }

      document.getElementById('productDrawer').classList.add('open');
    }

    function selTalle(t, el) {
      talleElegido = t;
      el.parentNode.querySelectorAll('.filter-chip-opt').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    function selColor(c, el) {
      colorElegido = c;
      el.parentNode.querySelectorAll('.filter-chip-opt').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    }

    function cerrarDrawerProd() {
      document.getElementById('productDrawer').classList.remove('open');
    }

    function confirmarAlCarrito() {
      carrito.push({
        id: prodActual.id,
        nombre: prodActual.nombre,
        precio: Number(prodActual.precio),
        talle: talleElegido,
        color: colorElegido
      });
      document.getElementById('dockCartCount').innerText = carrito.length;
      cerrarDrawerProd();
      abrirDrawerCarrito();
    }

    function abrirDrawerCarrito() {
      const list = document.getElementById('cartItemsContainer');
      let total = 0;
      if (carrito.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-dim); font-size:0.8rem; padding:15px 0;">El carrito está vacío</p>';
      } else {
        list.innerHTML = carrito.map((item, idx) => {
          total += item.precio;
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:10px 14px; border-radius:12px;">
              <div>
                <div style="font-weight:700; font-size:0.85rem;">${item.nombre}</div>
                <div style="font-size:0.7rem; color:var(--text-dim);">${item.talle} / ${item.color}</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-weight:800; font-size:0.9rem;">$${item.precio.toLocaleString('es-AR')}</span>
                <button onclick="borrarItem(${idx})" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cartSumPrice').innerText = `$${total.toLocaleString('es-AR')}`;
      document.getElementById('cartDrawer').classList.add('open');
    }

    function borrarItem(idx) {
      carrito.splice(idx, 1);
      document.getElementById('dockCartCount').innerText = carrito.length;
      abrirDrawerCarrito();
    }

    function cerrarDrawerCarrito() {
      document.getElementById('cartDrawer').classList.remove('open');
    }

    function checkoutWA() {
      const nom = document.getElementById('custName').value.trim();
      const dir = document.getElementById('custAddr').value.trim();
      if (!nom || !dir) return alert('Por favor completá tu nombre y dirección.');
      if (carrito.length === 0) return alert('El carrito está vacío.');

      let total = 0;
      let msg = `*MOKA MOTION - PEDIDO*\nCliente: ${nom}\nDestino: ${dir}\n\n`;
      carrito.forEach(p => {
        msg += `• ${p.nombre} [${p.talle} / ${p.color}] - $${p.precio.toLocaleString('es-AR')}\n`;
        total += p.precio;
      });
      msg += `\n*TOTAL: $${total.toLocaleString('es-AR')}*`;

      window.open(`https://wa.me/${TELEFONO_WA}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    init();
  </script>
</body>
</html>
